name: Dependency Review
on:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pinned from actions/checkout@v7.0.1

      - name: Dependency Review
        uses: actions/dependency-review-action@5a2ce3f5b92ee19cbb1548a4984c76d921e32efc # pinned from actions/dependency-review-action@v4
        with:
          fail-on-severity: high